name: Continuous Deployment

# Deploys automatically to the EC2 server whenever code is pushed to the
# main branch, as required by criterion 2. Uses appleboy/ssh-action to run
# a deploy script over SSH on the target server.
on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=()
          for name in SERVER_HOST SERVER_USERNAME SERVER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing GitHub Actions secret(s): %s. Configure them in Settings > Secrets and variables > Actions.\n' "${missing[*]}"
            exit 1
          fi

      - name: Deploy to EC2 server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/forum-api
            git pull origin main
            npm ci --omit=dev
            npm run migrate:up
            pm2 restart forum-api || pm2 start src/server.js --name forum-api
