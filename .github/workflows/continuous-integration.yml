name: Continuous Integration

# Runs linting, database migrations, and the automated test suite on pushes
# and pull requests targeting main or master.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # PostgreSQL Service Container — runs locally inside the CI job, so
      # integration tests don't need an externally hosted test database.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx eslint src --max-warnings=0

      - name: Run database migrations
        run: npm run migrate:up
        env:
          NODE_ENV: test
          PGHOST_TEST: localhost
          PGPORT_TEST: 5432
          PGUSER_TEST: developer
          PGPASSWORD_TEST: supersecretpassword
          PGDATABASE_TEST: forumapi_test
          DATABASE_URL: postgres://developer:supersecretpassword@localhost:5432/forumapi_test

      - name: Run unit, integration and functional tests
        run: npm run test:coverage
        env:
          NODE_ENV: test
          HOST: localhost
          PORT: 5000
          PGHOST_TEST: localhost
          PGPORT_TEST: 5432
          PGUSER_TEST: developer
          PGPASSWORD_TEST: supersecretpassword
          PGDATABASE_TEST: forumapi_test
          ACCESS_TOKEN_KEY: ci_access_token_secret
          REFRESH_TOKEN_KEY: ci_refresh_token_secret
          ACCESS_TOKEN_AGE: 3000
