# NGINX reverse-proxy config for Forum API
# - Terminates HTTPS with a Let's Encrypt certificate
# - Proxies all traffic to the Node.js app running on 127.0.0.1:5000
# - Rate-limits /threads and everything under it to 90 requests/minute per client IP,
#   protecting the resource from a DDoS-style burst of requests.
#
# Install: copy this file to /etc/nginx/sites-available/forumapi.conf and
# enable it with: sudo ln -s /etc/nginx/sites-available/forumapi.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# 90 requests per minute == 1.5 requests/sec, keyed by client IP.
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    listen 80;
    server_name 34-101-133-113.sslip.io;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 34-101-133-113.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/34-101-133-113.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-101-133-113.sslip.io/privkey.pem;

    # Rate-limited resource: /threads and everything nested under it
    # (comments, replies, likes all live under /threads/...).
    location = /threads {
        limit_req zone=threads_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /threads/ {
        limit_req zone=threads_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (users, authentications, health check) is not rate limited.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
